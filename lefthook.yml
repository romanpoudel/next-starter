pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob: 
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
    - run: npx ultracite fix
      stage_fixed: true
    - run: tsc --noEmit
      glob: "*.{ts,tsx}"

commit-msg:
  jobs:
    - run: npx --no -- commitlint --edit $1
